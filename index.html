<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- INFO-1: theme-color for both colour schemes so the browser chrome matches before JS hydrates -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111010" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f0e8" />
    <!-- LOW-4: page description for shareability / link previews -->
    <meta name="description" content="Play chess against Minimax or Stockfish, or watch two engines compete." />
    <title>Chess</title>
    <!-- ── Theme init: runs before first paint to prevent flash ── -->
    <script>
      (() => {
        const savedTheme = localStorage.getItem("chess-theme");
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        const theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : prefersLight
              ? "light"
              : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
